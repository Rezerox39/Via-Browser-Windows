<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:13px;
  user-select:none;-webkit-user-select:none;
  color:#e0e0e0;
}
#backdrop{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.55);
  cursor:pointer;
}
#menu-panel{
  position:absolute;top:0;right:0;bottom:0;width:320px;
  background:#101010;
  border-left:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;
  overflow:hidden;
  animation:slideIn 0.25s ease-out;
}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
#menu-grid{flex:1;overflow-y:auto;padding:12px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start}
.mi{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:14px 4px 8px;border-radius:10px;color:#999;cursor:pointer;
  transition:background 0.15s,color 0.15s;
}
.mi:hover{background:rgba(255,255,255,0.08);color:#fff}
.mi.active{color:#5a83ff}
.mi svg{width:22px;height:22px;margin-bottom:4px}
.mi span{font-size:10px;text-align:center}
#menu-footer{display:flex;justify-content:space-around;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.06)}
#menu-footer button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#888;font-size:10px;cursor:pointer;background:none;border:none}
#menu-footer button:hover{color:#fff}
#menu-footer svg{width:18px;height:18px}
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="menu-panel">
  <div id="menu-grid"></div>
  <div id="menu-footer">
    <button id="btn-collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg><span>Close</span></button>
  </div>
</div>
<script>
(function(){
  var backdrop=document.getElementById('backdrop');
  var grid=document.getElementById('menu-grid');

  function ic(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'+p+'</svg>'}

  var MENU_ITEMS=[
    {label:'Bookmarks',icon:'<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>',action:'bookmarks'},
    {label:'History',icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',action:'history'},
    {label:'Downloads',icon:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',action:'downloads'},
    {label:'Night',icon:'<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>',action:'night'},
    {label:'Desktop',icon:'<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',action:'desktop'},
    {label:'Find',icon:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',action:'find'},
    {label:'Share',icon:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',action:'share'},
    {label:'Refresh',icon:'<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>',action:'refresh'},
    {label:'Scripts',icon:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',action:'scripts'},
    {label:'Reader',icon:'<path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>',action:'reader'},
    {label:'Saved Pages',icon:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>',action:'saved'},
    {label:'Settings',icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>',action:'siteconfig'},
    {label:'Incognito',icon:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',action:'incognito'},
    {label:'Images',icon:'<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',action:'images'},
    {label:'Print',icon:'<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',action:'print'},
    {label:'Copy URL',icon:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4"/>',action:'share2'},
    {label:'Export',icon:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',action:'export'},
    {label:'Import',icon:'<polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',action:'import'},
    {label:'Cookies',icon:'<path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><circle cx="12" cy="12" r="2"/>',action:'cookies'},
    {label:'Block List',icon:'<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>',action:'blocklist'},
    {label:'Network',icon:'<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',action:'log'},
    {label:'Exit',icon:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',action:'exit'},
  ];

  function buildMenu(){
    grid.innerHTML='';
    MENU_ITEMS.forEach(function(item){
      var el=document.createElement('div');
      el.className='mi';
      el.innerHTML=ic(item.icon)+'<span>'+item.label+'</span>';
      el.addEventListener('click',function(){
        window.location.href='via-action://menu-item:'+item.action;
      });
      grid.appendChild(el);
    });
  }

  buildMenu();

  backdrop.addEventListener('click',function(){ window.location.href='via-action://close-menu'; });
  document.getElementById('btn-collapse').addEventListener('click',function(){ window.location.href='via-action://close-menu'; });

})();
</script>
</body>
</html>
