<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:13px;
  user-select:none;-webkit-user-select:none;
  color:#e0e0e0;
}
#menu-panel{
  position:absolute;top:0;right:0;bottom:0;width:100%;
  background:rgba(12,12,12,0.96);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-left:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
#menu-panel.open{transform:translateX(0)}
#menu-grid{flex:1;overflow-y:auto;padding:12px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;align-content:start}
.mi{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 4px 8px;border-radius:10px;color:#888;
  cursor:pointer;transition:background .15s,color .15s;
}
.mi:hover{background:rgba(255,255,255,0.06);color:#e0e0e0}
.mi.active{color:#5a83ff}
.mi svg{width:22px;height:22px;margin-bottom:3px}
.mi span{font-size:10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#menu-footer{display:flex;justify-content:space-around;padding:10px 12px;border-top:1px solid rgba(255,255,255,0.06)}
#menu-footer button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#888;font-size:10px;cursor:pointer;background:none;border:none}
#menu-footer button:hover{color:#e0e0e0}
#menu-footer svg{width:18px;height:18px}
</style>
</head>
<body>
<div id="menu-panel">
  <div id="menu-grid"></div>
  <div id="menu-footer">
    <button id="btn-exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Exit</span></button>
    <button id="btn-collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg><span>Collapse</span></button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('menu-panel');
  var grid=document.getElementById('menu-grid');
  var isOpen=false;

  function invoke(action,data){
    try{return window.__TAURI__.core.invoke(action,data||{})}catch(e){return Promise.reject(e)}
  }

  function ic(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'+p+'</svg>'}

  /* Menu items — mirrors the main menu but with simplified actions */
  var MENU_ITEMS=[
    {id:'bookmarks',label:'Bookmarks',icon:'<path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>',action:'bookmarks'},
    {id:'history',label:'History',icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',action:'history'},
    {id:'downloads',label:'Downloads',icon:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',action:'downloads'},
    {id:'night',label:'Night mode',icon:'<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>',action:'night'},
    {id:'desktop',label:'Desktop mode',icon:'<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',action:'desktop'},
    {id:'find',label:'Find',icon:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',action:'find'},
    {id:'share',label:'Share',icon:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',action:'share'},
    {id:'refresh',label:'Refresh',icon:'<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>',action:'refresh'},
    {id:'save',label:'Save page',icon:'<path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',action:'save'},
    {id:'images',label:'Show images',icon:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',action:'images'},
    {id:'ua',label:'User agent',icon:'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>',action:'ua'},
    {id:'scripts',label:'Scripts',icon:'<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',action:'scripts'},
    {id:'reader',label:'Reader',icon:'<path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>',action:'reader'},
    {id:'night2',label:'Incognito',icon:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',action:'incognito'},
    {id:'siteconf',label:'Site config',icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>',action:'siteconfig'},
    {id:'blocklist',label:'Block list',icon:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',action:'blocklist'},
    {id:'log',label:'Network log',icon:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',action:'log'},
    {id:'exit',label:'Exit',icon:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',action:'exit'},
  ];

  function buildMenu(){
    grid.innerHTML='';
    MENU_ITEMS.forEach(function(item){
      var el=document.createElement('div');
      el.className='mi';
      el.innerHTML=ic(item.icon)+'<span>'+item.label+'</span>';
      el.addEventListener('click',function(){
        /* Send action to main webview via Rust event */
        invoke('emit_to_main',{event:'menu-action',payload:item.action}).catch(function(){});
      });
      grid.appendChild(el);
    });
  }

  /* Listen for open/close from Rust */
  function listenEvents(){
    try{
      window.__TAURI__.event.listen('menu-overlay-toggle',function(ev){
        if(ev.payload==='open'){
          isOpen=true;buildMenu();panel.classList.add('open');
        }else if(ev.payload==='close'){
          isOpen=false;panel.classList.remove('open');
        }
      });
    }catch(e){}
  }

  document.getElementById('btn-exit').addEventListener('click',function(){
    invoke('emit_to_main',{event:'menu-action',payload:'exit'}).catch(function(){});
  });
  document.getElementById('btn-collapse').addEventListener('click',function(){
    isOpen=false;panel.classList.remove('open');
  });

  /* Panel background click to close */
  document.body.addEventListener('click',function(e){
    if(isOpen&&!e.target.closest('#menu-panel')){
      isOpen=false;panel.classList.remove('open');
    }
  });

  listenEvents();
})();
</script>
</body>
</html>
