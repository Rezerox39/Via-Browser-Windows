<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;
}
.nav{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:300px;height:60px;
  display:flex;align-items:center;justify-content:space-evenly;
  background:rgba(18,18,18,0.82);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:32px;
  box-shadow:0 10px 40px rgba(0,0,0,0.55);
  padding:0 6px;
  cursor:grab;
}
.nav:active{cursor:grabbing}
.nav button{
  width:46px;height:44px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:#9aa0a6;cursor:pointer;
  border-radius:50%;transition:all .15s;
}
.nav button:hover{color:#fff;background:rgba(255,255,255,0.10)}
.nav button:active{background:rgba(255,255,255,0.18)}
.nav svg{width:22px;height:22px}
#tab-count{
  display:flex;align-items:center;justify-content:center;
  min-width:22px;height:18px;border:1.5px solid currentColor;
  border-radius:5px;font-size:9px;font-weight:700;color:#fff;padding:0 3px;
}
</style>
</head>
<body>
<div class="nav" id="nav-pill">
  <button id="btn-back" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
  </button>
  <button id="btn-fwd" title="Forward">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>
  <button id="btn-home" title="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
  </button>
  <button id="btn-tabs" title="Tabs">
    <span id="tab-count">1</span>
  </button>
  <button id="btn-menu" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg>
  </button>
</div>
<script>
(function(){
  var pill=document.getElementById('nav-pill');

  /* IPC: try all known Tauri bridges */
  function hasIPC(){
    try{
      if(window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) return 'api';
      if(window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) return 'internals';
    }catch(e){}
    return null;
  }
  function callRust(cmd, args){
    var mode=hasIPC();
    if(mode==='api') return window.__TAURI__.core.invoke(cmd, args||{});
    if(mode==='internals') return window.__TAURI_INTERNALS__.invoke(cmd, args||{}, undefined);
    return Promise.reject(new Error('no-ipc'));
  }
  /* Report which IPC mode is available (visible in via-debug.log via title change) */
  try{ document.title='VIA-OVL:'+encodeURIComponent('ipc='+(hasIPC()||'none'))+'/'+Date.now(); }catch(e){}

  function fireCommand(action){
    callRust('on_nav_click',{action:action}).then(function(){}).catch(function(){
      /* Fallback: navigate to custom scheme, intercepted by Rust on_navigation */
      try{ window.location.href='via-action://'+action; }catch(e){}
    });
  }

  document.getElementById('btn-back').addEventListener('click',function(e){e.stopPropagation();fireCommand('back')});
  document.getElementById('btn-fwd').addEventListener('click',function(e){e.stopPropagation();fireCommand('forward')});
  document.getElementById('btn-home').addEventListener('click',function(e){e.stopPropagation();fireCommand('home')});
  document.getElementById('btn-tabs').addEventListener('click',function(e){e.stopPropagation();fireCommand('tabs')});
  document.getElementById('btn-menu').addEventListener('click',function(e){e.stopPropagation();fireCommand('menu')});

  /* Tab count updates pushed from Rust via eval */
  window.__updateTabCount=function(n){var e=document.getElementById('tab-count');if(e)e.textContent=n};

  /* 2D Dragging — grab from panel background, not buttons */
  var dragging=false,startX=0,startY=0,hasMoved=false,THRESHOLD=6;
  pill.addEventListener('mousedown',function(e){
    if(e.target.closest('button'))return;
    dragging=true;hasMoved=false;
    startX=e.clientX;startY=e.clientY;
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    var dx=e.clientX-startX, dy=e.clientY-startY;
    if(!hasMoved && (Math.abs(dx)>THRESHOLD || Math.abs(dy)>THRESHOLD)) hasMoved=true;
    if(hasMoved){
      callRust('on_nav_drag',{dx:dx,dy:dy}).catch(function(){});
      startX=e.clientX;startY=e.clientY;
    }
  });
  document.addEventListener('mouseup',function(){dragging=false});
})();
</script>
</body>
</html>
