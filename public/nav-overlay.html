<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;
}
.nav{
  display:flex;align-items:stretch;justify-content:space-evenly;
  width:100%;height:100%;
  background:rgba(16,16,16,0.75);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:28px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  padding:0 4px;
}
.nav button{
  flex:1;height:100%;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:#a0a0a0;cursor:pointer;
  border-radius:20px;transition:color .15s,background .15s;
}
.nav button:hover{color:#fff;background:rgba(255,255,255,0.1)}
.nav button:active{background:rgba(255,255,255,0.18)}
.nav button:disabled{opacity:0.3;pointer-events:none}
.nav svg{width:22px;height:22px}
#tab-count{
  display:flex;align-items:center;justify-content:center;
  min-width:26px;height:20px;border:1.5px solid currentColor;
  border-radius:5px;font-size:11px;font-weight:700;color:#fff;padding:0 4px;
}
</style>
</head>
<body>
<div class="nav" id="nav-pill">
  <button id="btn-back" title="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button id="btn-fwd" title="Forward">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <button id="btn-home" title="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
  </button>
  <button id="btn-tabs" title="Tabs">
    <span id="tab-count">1</span>
  </button>
  <button id="btn-menu" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
</div>
<script>
(function(){
  var pill=document.getElementById('nav-pill');

  function invoke(action){
    try{window.__TAURI__.core.invoke('on_nav_click',{action:action})}catch(e){}
  }
  document.getElementById('btn-back').addEventListener('click',function(e){e.stopPropagation();invoke('back')});
  document.getElementById('btn-fwd').addEventListener('click',function(e){e.stopPropagation();invoke('forward')});
  document.getElementById('btn-home').addEventListener('click',function(e){e.stopPropagation();invoke('home')});
  document.getElementById('btn-tabs').addEventListener('click',function(e){e.stopPropagation();invoke('tabs')});
  document.getElementById('btn-menu').addEventListener('click',function(e){e.stopPropagation();invoke('menu')});

  // 2D dragging
  var dragging=false,startX=0,startY=0,moved=false;
  pill.addEventListener('mousedown',function(e){
    if(e.target.closest('button'))return;
    dragging=true;moved=false;
    startX=e.screenX;startY=e.screenY;
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    var dx=e.screenX-startX;
    var dy=e.screenY-startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;
    if(moved){
      try{window.__TAURI__.core.invoke('on_nav_drag',{dx:dx,dy:dy})}catch(e){}
      startX=e.screenX;startY=e.screenY;
    }
  });
  document.addEventListener('mouseup',function(){dragging=false});
})();
</script>
</body>
</html>
