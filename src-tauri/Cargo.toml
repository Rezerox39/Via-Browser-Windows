[package]
name = "via-browser-win"
version = "7.4.7"
description = "Lightweight Tauri desktop browser inspired by Via Browser"
edition = "2021"

[lib]
name = "via_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "stream", "gzip", "charset"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
url = "2"
dirs = "5"
regex = "1"
unicode-normalization = "0.1"
# QR code scanning
rqrr = "0.5"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
rfd = "0.15"
arboard = { version = "3", features = ["image-data"] }
# Password manager (Windows Credential Manager via keyring)
keyring = { version = "3", features = ["sync-secret-service", "windows-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
